<!DOCTYPE html>

<body class="bg-slate-50 text-slate-800 font-sans leading-relaxed selection:bg-pink-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="fixed top-0 left-0 w-full bg-white/80 backdrop-blur-md shadow-sm z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="text-xl font-bold bg-gradient-to-r from-pink-500 to-rose-600 bg-clip-text text-transparent">

            </a>
            <nav class="hidden md:flex space-x-8 text-sm font-medium text-slate-600">

                <a href="#education" class="hover:text-pink-500 transition-colors">ประวัติการศึกษา</a>
                <a href="#skills" class="hover:text-pink-500 transition-colors">ทักษะ</a>

    <!-- Hero Section -->

        <div class="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-center gap-12">
            
            <!-- Profile Image Container -->
            <div class="flex-1 flex justify-center z-10 order-1 md:order-2">
                <div class="relative w-64 h-64 md:w-80 md:h-80 rounded-3xl bg-gradient-to-tr from-pink-400 to-rose-500 p-2 shadow-2xl rotate-2 hover:rotate-0 transition-transform duration-300">
                    <div class="w-full h-full rounded-[22px] overflow-hidden bg-white shadow-inner flex items-center justify-center">
                        <!-- หมายเหตุ: นำไฟล์รูปภาพขึ้น GitHub แล้วตั้งชื่อว่า profile.jpg หรือใส่ Direct Link รูปภาพตรงนี้ -->
                        <img src="profile.jpg" alt="นิยตา หอมเหล็ก" class="w-full h-full object-cover object-center hover:scale-105 transition-transform duration-500" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'text-center p-6 text-pink-500\'><i class=\'fa-solid fa-user-graduate text-6xl mb-2\'></i><p class=\'text-xs text-slate-500\'>อัปโหลดไฟล์ profile.jpg ขึ้น GitHub เพื่อแสดงรูปภาพ</p></div>';">
                    </div>
                </div>
            </div>

            <!-- Text Content -->
            <div class="flex-1 text-center md:text-left z-10 order-2 md:order-1">
                <span class="inline-block px-4 py-1
